<header class="navbar" [class.scrolled]="scrolled">
  <div class="nav-inner container">
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <div class="logo-icon">
        <i class="fa-solid fa-plus"></i>
      </div>
      <div class="logo-text">
        <span class="logo-main">Kamal Medicare</span>
        <span class="logo-sub">Cancer Centre & Hospital</span>
      </div>
    </a>

    <nav class="nav-links" [class.open]="menuOpen">
      <a routerLink="/facilities" routerLinkActive="active" (click)="closeMenu()">Facilities</a>
      <div class="dropdown">
        <a routerLink="/specializations" routerLinkActive="active">
          Specialization <i class="fas fa-chevron-down"></i>
        </a>
        <div class="dropdown-menu" *ngIf="specializations.length">
          <a *ngFor="let s of specializations" [routerLink]="['/specializations', s.speacializationid]" (click)="closeMenu()">
            {{ s.fieldname }}
          </a>
          <a routerLink="/specializations" (click)="closeMenu()" class="view-all">View All →</a>
        </div>
      </div>
      <a routerLink="/diseases" routerLinkActive="active" (click)="closeMenu()">Disease</a>
      <a routerLink="/news" routerLinkActive="active" (click)="closeMenu()">About Us</a>
      <a routerLink="/doctors" routerLinkActive="active" (click)="closeMenu()">Patient Guide</a>
      <ng-container *ngIf="auth.isAdmin()">
        <a routerLink="/admin" routerLinkActive="active" (click)="closeMenu()">
          <i class="fas fa-cog"></i> Admin
        </a>
      </ng-container>
    </nav>

    <div class="nav-actions">
      <ng-container *ngIf="!auth.isLoggedIn(); else loggedIn">
        <a routerLink="/auth/login" class="btn btn-outline">Login</a>
        <a routerLink="/doctors" class="btn btn-primary">Book Appointment</a>
      </ng-container>
      <ng-template #loggedIn>
        <span class="user-name">{{ auth.getCurrentUser()?.username }}</span>
        <button class="btn btn-outline" (click)="logout()">Logout</button>
        <a routerLink="/doctors" class="btn btn-primary">Book Appointment</a>
      </ng-template>
      <button class="burger" (click)="toggleMenu()" [class.open]="menuOpen">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<style>
.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: #fff; transition: box-shadow 0.3s;
  border-bottom: 1px solid #e0e7ef;
}
.navbar.scrolled { box-shadow: 0 2px 20px rgba(0,0,0,0.1); }
.nav-inner { display: flex; align-items: center; justify-content: space-between; height: 70px; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 40px; height: 40px; background: linear-gradient(135deg,#1565c0,#1e88e5);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 1.2rem;
}
.logo-main { display: block; font-weight: 700; font-size: 1rem; color: #1565c0; line-height: 1.2; }
.logo-sub { display: block; font-size: 0.7rem; color: #546e7a; }
.nav-links { display: flex; align-items: center; gap: 28px; }
.nav-links a { font-weight: 500; font-size: 0.9rem; color: #37474f; transition: color 0.2s; position: relative; }
.nav-links a:hover, .nav-links a.active { color: #1565c0; }
.dropdown { position: relative; }
.dropdown-menu {
  position: absolute; top: calc(100% + 12px); left: 50%; transform: translateX(-50%);
  background: #fff; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  border: 1px solid #e0e7ef; padding: 8px; min-width: 200px;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.dropdown:hover .dropdown-menu { opacity: 1; pointer-events: auto; }
.dropdown-menu a { display: block; padding: 8px 16px; border-radius: 8px; color: #37474f !important; font-weight: 400 !important; }
.dropdown-menu a:hover { background: #f0f4ff; color: #1565c0 !important; }
.dropdown-menu a.view-all { color: #1565c0 !important; font-weight: 600 !important; border-top: 1px solid #e0e7ef; margin-top: 4px; }
.nav-actions { display: flex; align-items: center; gap: 12px; }
.user-name { font-weight: 500; font-size: 0.9rem; color: #1565c0; }
.burger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 4px; }
.burger span { display: block; width: 24px; height: 2px; background: #37474f; transition: all 0.3s; }
@media (max-width: 900px) {
  .nav-links { display: none; position: fixed; top: 70px; left: 0; right: 0; bottom: 0; background: #fff; flex-direction: column; align-items: flex-start; padding: 24px; gap: 0; overflow-y: auto; }
  .nav-links.open { display: flex; }
  .nav-links a { padding: 14px 0; border-bottom: 1px solid #f0f4ff; width: 100%; font-size: 1rem; }
  .burger { display: flex; }
  .dropdown-menu { position: static; transform: none; opacity: 1; pointer-events: auto; box-shadow: none; border: none; padding-left: 16px; }
}
</style>
