<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <i class="fa-solid fa-house-medical auth-logo"></i>
      <h2>Welcome Back</h2>
      <p>Sign in to your Kamal Medicare account</p>
    </div>

    <div class="alert alert-danger" *ngIf="error">
      <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
    </div>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-user"></i>
          <input 
            type="text" 
            id="username" 
            [(ngModel)]="username" 
            name="username" 
            placeholder="Enter username" 
            required
            class="form-control" 
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input 
            type="password" 
            id="password" 
            [(ngModel)]="password" 
            name="password" 
            placeholder="Enter password" 
            required
            class="form-control" 
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block auth-btn" [disabled]="loading">
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Logging in...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Register here</a></p>
    </div>
  </div>
</div>
