<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <i class="fa-solid fa-house-medical auth-logo"></i>
      <h2>Create Account</h2>
      <p>Register as a Visitor to book appointments</p>
    </div>

    <div class="alert alert-danger" *ngIf="error">
      <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
    </div>

    <form (ngSubmit)="register()">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-user"></i>
          <input 
            type="text" 
            id="username" 
            [(ngModel)]="username" 
            name="username" 
            placeholder="Choose username" 
            required
            class="form-control" 
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-envelope"></i>
          <input 
            type="email" 
            id="email" 
            [(ngModel)]="email" 
            name="email" 
            placeholder="Enter email address" 
            required
            class="form-control" 
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input 
            type="password" 
            id="password" 
            [(ngModel)]="password" 
            name="password" 
            placeholder="At least 6 characters" 
            required
            class="form-control" 
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-lock-open"></i>
          <input 
            type="password" 
            id="confirmPassword" 
            [(ngModel)]="confirmPassword" 
            name="confirmPassword" 
            placeholder="Repeat password" 
            required
            class="form-control" 
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block auth-btn" [disabled]="loading">
        <span *ngIf="!loading">Register</span>
        <span *ngIf="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Registering...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Login here</a></p>
    </div>
  </div>
</div>
