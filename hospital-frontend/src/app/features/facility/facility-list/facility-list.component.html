<div class="page-header"><h1>Our Facilities</h1><p>State-of-the-art infrastructure for comprehensive patient care</p></div>
<section class="section"><div class="container">
  <div class="loader" *ngIf="loading"><div class="spinner"></div></div>
  <div class="grid grid-2" *ngIf="!loading">
    <div class="card facility-big-card" *ngFor="let f of facilities">
      <div class="facility-imgs" *ngIf="f.images?.length">
        <img [src]="getImageUrl(f.images![0].imagepath)" [alt]="f.facilityname" loading="lazy">
      </div>
      <div class="fac-body">
        <div class="fac-header">
          <h3>{{ f.facilityname }}</h3>
          <span class="badge" [class.badge-green]="f.availability === 'yes'" [class.badge-red]="f.availability === 'no'">
            {{ f.availability === 'yes' ? 'Available' : 'Unavailable' }}
          </span>
        </div>
        <span *ngIf="f.facilitytype" class="badge badge-blue" style="margin-bottom:10px;display:inline-block">{{ f.facilitytype }}</span>
        <div class="fac-desc" [innerHTML]="f.description"></div>
      </div>
    </div>
  </div>
  <div *ngIf="!loading && facilities.length === 0" class="empty-state"><i class="fas fa-hospital-alt"></i><p>No facilities found.</p></div>
</div></section>
<style>
.facility-big-card { overflow: hidden; }
.facility-imgs img { width: 100%; height: 200px; object-fit: cover; }
.fac-body { padding: 24px; }
.fac-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.fac-header h3 { color: #1565c0; font-size: 1.1rem; }
.fac-desc { color: #546e7a; font-size: 0.9rem; line-height: 1.7; margin-top: 8px; }
.empty-state { text-align: center; padding: 60px; color: #90a4ae; }
.empty-state i { font-size: 3rem; margin-bottom: 16px; display: block; }
</style>
