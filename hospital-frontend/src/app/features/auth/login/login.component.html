<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo"><i class="fa-solid fa-plus"></i></div>
      <h2>Welcome Back</h2>
      <p>Sign in to your Kamal Medicare account</p>
    </div>

    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Username *</label>
        <input type="text" formControlName="username" placeholder="Enter username">
        <div class="error-msg" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
          Username must be at least 3 characters.
        </div>
      </div>
      <div class="form-group">
        <label>Password *</label>
        <input type="password" formControlName="password" placeholder="Enter password">
        <div class="error-msg" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          Password must be at least 6 characters.
        </div>
      </div>
      <button type="submit" class="btn btn-blue w-full" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="auth-divider"><span>or</span></div>

    <button class="btn-google" (click)="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18Z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58Z" fill="#EA4335"/></svg>
      Continue with Google
    </button>

    <p class="auth-link">Don't have an account? <a routerLink="/auth/register">Register</a></p>
  </div>
</div>

<style>
.auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#e8f0fe,#f8faff); padding: 100px 24px 40px; }
.auth-card { background: #fff; border-radius: 20px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 8px 40px rgba(21,101,192,0.12); }
.auth-header { text-align: center; margin-bottom: 28px; }
.auth-logo { width: 56px; height: 56px; background: linear-gradient(135deg,#1565c0,#1e88e5); border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.5rem; margin: 0 auto 16px; }
.auth-header h2 { font-size: 1.5rem; margin-bottom: 6px; }
.auth-header p { color: #546e7a; font-size: 0.9rem; }
.w-full { width: 100%; justify-content: center; }
.auth-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: #90a4ae; font-size: 0.85rem; }
.auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: #e0e7ef; }
.btn-google { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 11px; border: 1.5px solid #e0e7ef; border-radius: 50px; background: #fff; font-size: 0.9rem; font-weight: 600; color: #37474f; cursor: pointer; font-family: inherit; transition: all 0.2s; }
.btn-google:hover { border-color: #1565c0; box-shadow: 0 2px 12px rgba(21,101,192,0.1); }
.auth-link { text-align: center; margin-top: 20px; color: #546e7a; font-size: 0.9rem; }
.auth-link a { color: #1565c0; font-weight: 600; }
</style>
