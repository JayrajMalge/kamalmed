<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo"><i class="fa-solid fa-plus"></i></div>
      <h2>Create Account</h2>
      <p>Join Kamal Medicare</p>
    </div>

    <div class="alert alert-error" *ngIf="error">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Username *</label>
        <input type="text" formControlName="username" placeholder="3-30 characters">
        <div class="error-msg" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">Valid username is required (3-30 chars).</div>
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" formControlName="email" placeholder="your@email.com">
        <div class="error-msg" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">Valid email is required.</div>
      </div>
      <div class="form-group">
        <label>Password *</label>
        <input type="password" formControlName="password" placeholder="Min 6 characters">
        <div class="error-msg" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">Password must be 6-50 characters.</div>
      </div>
      <div class="form-group">
        <label>Confirm Password *</label>
        <input type="password" formControlName="confirm" placeholder="Repeat password">
        <div class="error-msg" *ngIf="form.hasError('mismatch') && form.get('confirm')?.touched">Passwords do not match.</div>
      </div>
      <button type="submit" class="btn btn-blue w-full" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <p class="auth-link">Already have an account? <a routerLink="/auth/login">Sign In</a></p>
  </div>
</div>

<style>
.auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#e8f0fe,#f8faff); padding: 100px 24px 40px; }
.auth-card { background: #fff; border-radius: 20px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 8px 40px rgba(21,101,192,0.12); }
.auth-header { text-align: center; margin-bottom: 28px; }
.auth-logo { width: 56px; height: 56px; background: linear-gradient(135deg,#1565c0,#1e88e5); border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.5rem; margin: 0 auto 16px; }
.auth-header h2 { font-size: 1.5rem; margin-bottom: 6px; }
.auth-header p { color: #546e7a; font-size: 0.9rem; }
.w-full { width: 100%; justify-content: center; }
.auth-link { text-align: center; margin-top: 20px; color: #546e7a; font-size: 0.9rem; }
.auth-link a { color: #1565c0; font-weight: 600; }
</style>
