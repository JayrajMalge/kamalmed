<div class="page-header"><h1>Diseases We Treat</h1><p>Comprehensive information on conditions we specialise in</p></div>
<section class="section"><div class="container">
  <div class="loader" *ngIf="loading"><div class="spinner"></div></div>
  <div class="disease-layout" *ngIf="!loading">
    <aside class="disease-sidebar">
      <h4>Select Disease</h4>
      <button *ngFor="let d of diseases" class="disease-btn" [class.active]="activeDisease?.diseaseid === d.diseaseid" (click)="selectDisease(d)">
        {{ d.name }}
      </button>
    </aside>
    <div class="disease-content" *ngIf="activeDisease">
      <h2>{{ activeDisease.name }}</h2>
      <div class="disease-images" *ngIf="activeDisease.images?.length">
        <img *ngFor="let img of activeDisease.images" [src]="getImageUrl(img.imagepath)" [alt]="img.imagename" loading="lazy">
      </div>
      <div class="disease-desc" [innerHTML]="activeDisease.description"></div>
    </div>
  </div>
</div></section>
<style>
.disease-layout { display: grid; grid-template-columns: 220px 1fr; gap: 32px; }
.disease-sidebar h4 { font-size: 0.85rem; font-weight: 700; color: #90a4ae; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
.disease-btn { display: block; width: 100%; text-align: left; padding: 10px 14px; border: none; border-radius: 8px; background: none; font-size: 0.9rem; color: #37474f; cursor: pointer; margin-bottom: 4px; transition: all 0.2s; font-family: inherit; }
.disease-btn:hover, .disease-btn.active { background: #e8f0fe; color: #1565c0; font-weight: 600; }
.disease-content h2 { color: #1565c0; font-size: 1.5rem; margin-bottom: 20px; }
.disease-images { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.disease-images img { height: 200px; border-radius: 8px; object-fit: cover; }
.disease-desc { color: #37474f; line-height: 1.8; }
@media (max-width: 700px) { .disease-layout { grid-template-columns: 1fr; } .disease-sidebar { display: flex; flex-wrap: wrap; gap: 8px; } .disease-sidebar h4 { width: 100%; } }
</style>
