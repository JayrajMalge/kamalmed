<div class="page-header">
  <h1>Our Specializations</h1>
  <p>Expert care across a wide range of medical disciplines</p>
</div>

<section class="section">
  <div class="container">
    <div class="loader" *ngIf="loading"><div class="spinner"></div></div>
    <div class="grid grid-3" *ngIf="!loading">
      <div class="card spec-card" *ngFor="let s of specializations" [routerLink]="['/specializations', s.speacializationid]">
        <div class="spec-img" *ngIf="s.imagepath; else noImg">
          <img [src]="getImageUrl(s.imagepath)" [alt]="s.fieldname" loading="lazy">
        </div>
        <ng-template #noImg>
          <div class="spec-placeholder"><i class="fas fa-stethoscope"></i></div>
        </ng-template>
        <div class="spec-card-body">
          <h3>{{ s.fieldname }}</h3>
          <p [innerHTML]="s.description?.slice(0, 120) + '...'"></p>
          <span class="link-arrow">Learn More <i class="fas fa-arrow-right"></i></span>
        </div>
      </div>
    </div>
    <div *ngIf="!loading && specializations.length === 0" class="empty-state">
      <i class="fas fa-stethoscope"></i>
      <p>No specializations found.</p>
    </div>
  </div>
</section>

<style>
.spec-card { cursor: pointer; }
.spec-img img { width: 100%; height: 180px; object-fit: cover; }
.spec-placeholder { height: 140px; background: linear-gradient(135deg,#e8f0fe,#c5cae9); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: #1565c0; }
.spec-card-body { padding: 20px; }
.spec-card-body h3 { color: #1565c0; margin-bottom: 8px; }
.spec-card-body p { color: #546e7a; font-size: 0.88rem; margin-bottom: 12px; }
.link-arrow { color: #1565c0; font-size: 0.85rem; font-weight: 600; }
.empty-state { text-align: center; padding: 60px; color: #90a4ae; }
.empty-state i { font-size: 3rem; margin-bottom: 16px; display: block; }
</style>
