<div class="admin-section">
  <div class="section-header"><h2>Appointments</h2></div>
  <div class="loader" *ngIf="loading"><div class="spinner"></div></div>
  <div class="admin-table" *ngIf="!loading">
    <table>
      <thead><tr><th>ID</th><th>Doctor</th><th>Date</th><th>Mobile</th><th>Status</th><th>Action</th></tr></thead>
      <tbody>
        <tr *ngFor="let a of appointments">
          <td>#{{ a.appointmentid }}</td>
          <td>{{ a.doctor?.name || '—' }}</td>
          <td>{{ a.appointmentdate | date:'medium' }}</td>
          <td>{{ a.mobileno }}</td>
          <td>
            <span class="status-badge" [ngClass]="'status-' + a.status?.toLowerCase()">{{ a.status }}</span>
          </td>
          <td>
            <select class="status-select" [value]="a.status" (change)="updateStatus(a.appointmentid!, $any($event.target).value)">
              <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
            </select>
          </td>
        </tr>
      </tbody>
    </table>
    <div *ngIf="appointments.length === 0" class="empty-state"><p>No appointments yet.</p></div>
  </div>
</div>
<style>
.admin-section { max-width: 1000px; }
.section-header { margin-bottom: 24px; }
.section-header h2 { font-size: 1.4rem; color: #1565c0; }
.admin-table { background: #fff; border-radius: 12px; border: 1px solid #e0e7ef; overflow: auto; }
table { width: 100%; border-collapse: collapse; min-width: 700px; }
th { background: #f0f4ff; padding: 12px 16px; text-align: left; font-size: 0.82rem; font-weight: 700; text-transform: uppercase; color: #546e7a; }
td { padding: 12px 16px; border-bottom: 1px solid #f0f4ff; font-size: 0.9rem; }
tr:last-child td { border-bottom: none; }
.status-badge { display: inline-block; padding: 4px 10px; border-radius: 50px; font-size: 0.78rem; font-weight: 600; }
.status-scheduled { background: rgba(21,101,192,0.1); color: #1565c0; }
.status-completed { background: rgba(56,142,60,0.1); color: #388e3c; }
.status-canceled { background: rgba(229,57,53,0.1); color: #e53935; }
.status-select { padding: 6px 10px; border: 1px solid #e0e7ef; border-radius: 8px; font-size: 0.85rem; background: #fff; font-family: inherit; }
.empty-state { padding: 32px; text-align: center; color: #90a4ae; }
</style>
