<div class="admin-section">
  <div class="section-header"><h2>Facilities</h2></div>
  <div class="admin-form card">
    <h3>{{ editingId ? 'Edit' : 'Add' }} Facility</h3>
    <div class="alert alert-success" *ngIf="success">{{ success }}</div>
    <div class="alert alert-error" *ngIf="error">{{ error }}</div>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group"><label>Facility Name *</label><input type="text" formControlName="facilityname" placeholder="e.g. Emergency Care">
        <div class="error-msg" *ngIf="form.get('facilityname')?.invalid && form.get('facilityname')?.touched">Name required (max 30 chars).</div></div>
      <div class="form-group"><label>Description *</label>
        <app-rich-text-editor formControlName="description" placeholder="Describe this facility..."></app-rich-text-editor>
        <div class="error-msg" *ngIf="form.get('description')?.invalid && form.get('description')?.touched">Description required.</div></div>
      <div class="form-row">
        <div class="form-group"><label>Facility Type</label><input type="text" formControlName="facilitytype" placeholder="e.g. Diagnostic"></div>
        <div class="form-group"><label>Availability *</label>
          <select formControlName="availability"><option value="yes">Yes</option><option value="no">No</option></select></div>
      </div>
      <div class="form-group"><label>Images</label><input type="file" accept="image/*" multiple (change)="onImagesChange($event)"></div>
      <div class="form-actions">
        <button type="submit" class="btn btn-blue" [disabled]="submitting">{{ submitting ? 'Saving...' : (editingId ? 'Update' : 'Add') }}</button>
        <button type="button" class="btn btn-outline" *ngIf="editingId" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
  <div class="loader" *ngIf="loading"><div class="spinner"></div></div>
  <div class="admin-table" *ngIf="!loading">
    <table><thead><tr><th>Name</th><th>Type</th><th>Available</th><th>Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let f of facilities">
          <td><strong>{{ f.facilityname }}</strong></td>
          <td>{{ f.facilitytype || '—' }}</td>
          <td><span class="badge" [class.badge-green]="f.availability === 'yes'" [class.badge-red]="f.availability === 'no'">{{ f.availability }}</span></td>
          <td class="actions">
            <button class="btn-icon edit" (click)="edit(f)"><i class="fas fa-edit"></i></button>
            <button class="btn-icon delete" (click)="delete(f.facilitesid)"><i class="fas fa-trash"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
    <div *ngIf="facilities.length === 0" class="empty-state"><p>No facilities yet.</p></div>
  </div>
</div>
<style>
.admin-section { max-width: 900px; }
.section-header { margin-bottom: 24px; }
.section-header h2 { font-size: 1.4rem; color: #1565c0; }
.admin-form { padding: 28px; margin-bottom: 28px; }
.admin-form h3 { font-size: 1rem; font-weight: 700; margin-bottom: 20px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-actions { display: flex; gap: 12px; }
.admin-table { background: #fff; border-radius: 12px; border: 1px solid #e0e7ef; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { background: #f0f4ff; padding: 12px 16px; text-align: left; font-size: 0.82rem; font-weight: 700; text-transform: uppercase; color: #546e7a; }
td { padding: 12px 16px; border-bottom: 1px solid #f0f4ff; font-size: 0.9rem; }
tr:last-child td { border-bottom: none; }
.actions { display: flex; gap: 8px; }
.btn-icon { width: 34px; height: 34px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; transition: all 0.2s; }
.btn-icon.edit { background: #e8f0fe; color: #1565c0; }
.btn-icon.edit:hover { background: #1565c0; color: #fff; }
.btn-icon.delete { background: rgba(229,57,53,0.1); color: #e53935; }
.btn-icon.delete:hover { background: #e53935; color: #fff; }
.empty-state { padding: 32px; text-align: center; color: #90a4ae; }
</style>
