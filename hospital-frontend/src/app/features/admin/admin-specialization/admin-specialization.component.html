<div class="admin-section">
  <div class="section-header">
    <h2>Specializations</h2>
  </div>

  <div class="admin-form card">
    <h3>{{ editingId ? 'Edit' : 'Add' }} Specialization</h3>
    <div class="alert alert-success" *ngIf="success">{{ success }}</div>
    <div class="alert alert-error" *ngIf="error">{{ error }}</div>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Field Name *</label>
        <input type="text" formControlName="fieldname" placeholder="e.g. Oncology">
        <div class="error-msg" *ngIf="form.get('fieldname')?.invalid && form.get('fieldname')?.touched">Name is required (max 50 chars).</div>
      </div>
      <div class="form-group">
        <label>Description *</label>
        <app-rich-text-editor label="" formControlName="description" placeholder="Enter description..."></app-rich-text-editor>
        <div class="error-msg" *ngIf="form.get('description')?.invalid && form.get('description')?.touched">Description is required.</div>
      </div>
      <div class="form-group">
        <label>Image</label>
        <input type="file" accept="image/*" (change)="onImageChange($event)">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-blue" [disabled]="submitting">{{ submitting ? 'Saving...' : (editingId ? 'Update' : 'Add') }}</button>
        <button type="button" class="btn btn-outline" *ngIf="editingId" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>

  <div class="loader" *ngIf="loading"><div class="spinner"></div></div>

  <div class="admin-table" *ngIf="!loading">
    <table>
      <thead><tr><th>Name</th><th>Image</th><th>Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let s of specializations">
          <td><strong>{{ s.fieldname }}</strong></td>
          <td><img *ngIf="s.imagepath" [src]="getImageUrl(s.imagepath)" class="thumb" [alt]="s.fieldname"></td>
          <td class="actions">
            <button class="btn-icon edit" (click)="edit(s)"><i class="fas fa-edit"></i></button>
            <button class="btn-icon delete" (click)="delete(s.speacializationid)"><i class="fas fa-trash"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
    <div *ngIf="specializations.length === 0" class="empty-state"><p>No specializations yet.</p></div>
  </div>
</div>

<style>
.admin-section { max-width: 900px; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.section-header h2 { font-size: 1.4rem; color: #1565c0; }
.admin-form { padding: 28px; margin-bottom: 28px; }
.admin-form h3 { font-size: 1rem; font-weight: 700; color: #1a1a2e; margin-bottom: 20px; }
.form-actions { display: flex; gap: 12px; }
.admin-table { background: #fff; border-radius: 12px; border: 1px solid #e0e7ef; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { background: #f0f4ff; padding: 12px 16px; text-align: left; font-size: 0.82rem; font-weight: 700; text-transform: uppercase; color: #546e7a; letter-spacing: 0.5px; }
td { padding: 12px 16px; border-bottom: 1px solid #f0f4ff; font-size: 0.9rem; }
tr:last-child td { border-bottom: none; }
.thumb { height: 40px; width: 60px; object-fit: cover; border-radius: 6px; }
.actions { display: flex; gap: 8px; }
.btn-icon { width: 34px; height: 34px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; transition: all 0.2s; }
.btn-icon.edit { background: #e8f0fe; color: #1565c0; }
.btn-icon.edit:hover { background: #1565c0; color: #fff; }
.btn-icon.delete { background: rgba(229,57,53,0.1); color: #e53935; }
.btn-icon.delete:hover { background: #e53935; color: #fff; }
.empty-state { padding: 32px; text-align: center; color: #90a4ae; }
</style>
