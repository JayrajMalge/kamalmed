<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><i class="fa-solid fa-plus"></i></div>
      <div>
        <div class="brand-name">Kamal Medicare</div>
        <div class="brand-sub">Admin Panel</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a *ngFor="let item of menuItems" [routerLink]="item.route" routerLinkActive="active" class="nav-item">
        <i class="fas" [ngClass]="item.icon"></i>
        <span>{{ item.label }}</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-action" (click)="goHome()"><i class="fas fa-home"></i> View Website</button>
      <button class="sidebar-action danger" (click)="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <h1 class="topbar-title">Admin Dashboard</h1>
      <div class="topbar-user">
        <i class="fas fa-user-circle"></i>
        <span>{{ auth.getCurrentUser()?.username }}</span>
      </div>
    </header>
    <div class="admin-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<style>
.admin-shell { display: flex; height: 100vh; overflow: hidden; }
.admin-sidebar { width: 250px; background: #0d47a1; color: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.brand-icon { width: 36px; height: 36px; background: rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
.brand-name { font-weight: 700; font-size: 0.95rem; }
.brand-sub { font-size: 0.72rem; opacity: 0.7; }
.sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: rgba(255,255,255,0.8); text-decoration: none; margin-bottom: 4px; font-size: 0.88rem; font-weight: 500; transition: all 0.2s; }
.nav-item i { width: 20px; text-align: center; font-size: 0.95rem; }
.nav-item:hover { background: rgba(255,255,255,0.1); color: #fff; }
.nav-item.active { background: rgba(255,255,255,0.2); color: #fff; font-weight: 600; }
.sidebar-footer { padding: 16px 12px; border-top: 1px solid rgba(255,255,255,0.1); }
.sidebar-action { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border-radius: 10px; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 0.85rem; cursor: pointer; font-family: inherit; margin-bottom: 6px; transition: all 0.2s; }
.sidebar-action:hover { background: rgba(255,255,255,0.2); }
.sidebar-action.danger { background: rgba(229,57,53,0.2); }
.sidebar-action.danger:hover { background: rgba(229,57,53,0.35); }
.admin-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.admin-topbar { background: #fff; border-bottom: 1px solid #e0e7ef; padding: 0 28px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
.topbar-title { font-size: 1.1rem; font-weight: 700; color: #1565c0; }
.topbar-user { display: flex; align-items: center; gap: 8px; color: #546e7a; font-size: 0.9rem; }
.topbar-user i { font-size: 1.2rem; color: #1565c0; }
.admin-content { flex: 1; overflow-y: auto; padding: 28px; background: #f8faff; }
</style>
