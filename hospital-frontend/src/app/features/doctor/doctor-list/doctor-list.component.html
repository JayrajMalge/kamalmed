<div class="page-header"><h1>Our Doctors</h1><p>Experienced specialists dedicated to your health</p></div>
<section class="section"><div class="container">
  <div class="loader" *ngIf="loading"><div class="spinner"></div></div>
  <div class="grid grid-3" *ngIf="!loading">
    <div class="card doctor-card" *ngFor="let d of doctors" [routerLink]="['/doctors', d.doctorid]">
      <div class="doctor-img" *ngIf="d.profilephotopath; else noPhoto">
        <img [src]="getImageUrl(d.profilephotopath)" [alt]="d.name" loading="lazy">
      </div>
      <ng-template #noPhoto><div class="doctor-img-placeholder"><i class="fas fa-user-md"></i></div></ng-template>
      <div class="doctor-info">
        <h3>{{ d.name }}</h3>
        <p class="spec-name" *ngIf="d.specializations?.[0]?.specialization">{{ d.specializations![0].specialization!.fieldname }}</p>
        <p class="schedule" *ngIf="d.schedulefrom && d.scheduleto"><i class="fas fa-clock"></i> {{ d.schedulefrom }} – {{ d.scheduleto }}</p>
        <a [routerLink]="['/doctors', d.doctorid]" class="btn btn-blue" style="margin-top:12px;width:100%">Book Appointment</a>
      </div>
    </div>
  </div>
  <div *ngIf="!loading && doctors.length === 0" class="empty-state"><i class="fas fa-user-md"></i><p>No doctors found.</p></div>
</div></section>
<style>
.doctor-card { cursor: pointer; text-align: center; }
.doctor-img img { width: 100%; height: 220px; object-fit: cover; }
.doctor-img-placeholder { width: 100%; height: 180px; background: linear-gradient(135deg,#e8f0fe,#c5cae9); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #1565c0; }
.doctor-info { padding: 20px; }
.doctor-info h3 { font-size: 1.05rem; margin-bottom: 6px; }
.spec-name { color: #1565c0; font-size: 0.85rem; font-weight: 500; }
.schedule { color: #546e7a; font-size: 0.82rem; margin-top: 6px; }
.empty-state { text-align: center; padding: 60px; color: #90a4ae; }
.empty-state i { font-size: 3rem; margin-bottom: 16px; display: block; }
</style>
